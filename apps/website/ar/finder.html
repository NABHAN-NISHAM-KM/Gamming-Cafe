  <style>
    .finder { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; }
    #map { height: 560px; border: 1px solid var(--line); background: var(--panel); }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .filters select, .filters input { max-width: 100%; min-width: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); padding: 10px 12px; font: inherit; }
    .list { display: flex; flex-direction: column; gap: 10px; max-height: 560px; overflow: auto; }
    .vcard { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; display: block; color: inherit; text-decoration: none; }
    .vcard:hover, .vcard:focus-visible { border-color: var(--accent); }
    .vcard b { display: block; } .vcard small { color: var(--ink-3); }
    .vcard .free { font: 500 12px var(--mono); color: var(--green); }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; } .tags span { font: 11px var(--mono); border: 1px solid var(--line-2); padding: 2px 6px; color: var(--ink-2); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 900px) { .finder { grid-template-columns: 1fr; } #map { height: 360px; } .list { max-height: none; } }
  </style>
</head>
<body>
  <header id="nav"></header>
  <main>
    <section class="hero" style="border-bottom:0;padding-bottom:16px">
      <div class="hero-grid"></div>
      <div class="wrap">
        <span class="eyebrow">ابحث عن مكان</span>
        <h1 style="font-size:clamp(48px,6.5vw,104px)!important">العب بالقرب منك.</h1>
        <p class="lead">أماكن تعمل بنظام ArenaOS ونشرت صفحتها — اعرف أيها لديه أجهزة متاحة الآن، والأسعار والبطولات، واحجز دون تطبيق.</p>
      </div>
    </section>
    <div class="wrap" style="padding-bottom:96px">
      <div class="filters">
        <label class="sr-only" for="q">بحث</label><input id="q" type="search" placeholder="اسم المكان أو المنطقة" />
        <label class="sr-only" for="city">المدينة</label><select id="city"><option value="">كل المدن</option></select>
        <label class="sr-only" for="kind">النوع</label><select id="kind"><option value="">حواسيب وكونسول وواقع افتراضي</option><option value="PC">حواسيب ألعاب</option><option value="CONSOLE">كونسول</option><option value="VR">واقع افتراضي</option><option value="SIMULATOR">محاكيات</option></select>
      </div>
      <div class="finder">
        <div class="list" id="list" aria-live="polite"><p style="color:var(--ink-3)">جارٍ تحميل الأماكن…</p></div>
        <div id="map" role="region" aria-label="خريطة الأماكن"></div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>
  <script src="../assets/site.js?v=7"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const ar = document.documentElement.lang === "ar";
    const L10N = ar
      ? { none: "لا توجد أماكن مطابقة.", empty: "لم تنشر أي أماكن صفحتها بعد.", free: (n) => `${n} متاح الآن`, open: "عرض الصفحة والحجز" }
      : { none: "No venues match.", empty: "No venues have published their page yet.", free: (n) => `${n} free now`, open: "See page & book" };
    // Zone types grouped the way players think of them.
    const GROUP = { PC_STANDARD: "PC", PC_VIP: "PC", BOOTCAMP: "PC", STREAMING: "PC", INTERNET: "PC", CONSOLE: "CONSOLE", VR: "VR", SIMULATOR: "SIMULATOR" };
    const KIND = { PC: ar ? "حواسيب ألعاب" : "Gaming PCs", CONSOLE: ar ? "كونسول" : "Consoles", VR: "VR", SIMULATOR: ar ? "محاكيات" : "Simulators" };
    const kindsOf = (b) => [...new Set(b.kinds.map((k) => GROUP[k]).filter(Boolean))];
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const base = document.documentElement.dataset.base ?? "";
    let all = [];
    const map = window.L ? L.map("map", { scrollWheelZoom: false }).setView([25.2, 55.3], 4) : null;
    if (map) L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    const layer = map ? L.layerGroup().addTo(map) : null;
    const free = new Map();

    function render(fit = true) {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const city = document.getElementById("city").value;
      const kind = document.getElementById("kind").value;
      const rows = all.flatMap((v) => v.branches.map((b) => ({ v, b })))
        .filter(({ v, b }) => (!city || b.city === city) && (!kind || kindsOf(b).includes(kind)) && (!q || `${v.name} ${b.name} ${b.address ?? ""} ${b.city ?? ""}`.toLowerCase().includes(q)));
      const list = document.getElementById("list");
      list.innerHTML = rows.length
        ? rows.map(({ v, b }) => `<a class="vcard" href="${base}v/${encodeURIComponent(v.slug)}"><b>${esc(v.name)}${v.branches.length > 1 ? ` · ${esc(b.name)}` : ""}</b>
            <small>${esc([b.address, b.city].filter(Boolean).join(", "))}</small>
            ${free.has(b.id) ? `<div class="free">${L10N.free(free.get(b.id))}</div>` : ""}
            <div class="tags">${kindsOf(b).map((k) => `<span>${esc(KIND[k])}</span>`).join("")}</div></a>`).join("")
        : `<p style="color:var(--ink-3)">${all.length ? L10N.none : L10N.empty}</p>`;
      if (!layer) return;
      layer.clearLayers();
      const pts = rows.filter(({ b }) => b.lat != null && b.lng != null).map(({ v, b }) =>
        L.marker([b.lat, b.lng]).bindPopup(`<b>${esc(v.name)}</b><br>${esc(b.name)}<br><a href="${base}v/${encodeURIComponent(v.slug)}">${L10N.open}</a>`).addTo(layer).getLatLng());
      if (fit && pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 13 });
    }

    fetch("/v1/app/venues").then((r) => (r.ok ? r.json() : [])).catch(() => []).then((venues) => {
      all = venues;
      const cities = [...new Set(venues.flatMap((v) => v.branches.map((b) => b.city)).filter(Boolean))].sort();
      document.getElementById("city").append(...cities.map((c) => new Option(c, c)));
      render();
      // Free stations right now, per branch (the same counts the venue's page shows), kept current every minute.
      const counts = (fit) => {
        for (const v of venues.slice(0, 40))
          fetch(`/v1/app/${encodeURIComponent(v.slug)}/public`).then((r) => r.ok && r.json()).then((p) => {
            if (!p) return;
            for (const b of p.branches) free.set(b.id, b.zones.reduce((t, z) => t + z.free, 0));
            render(fit);
          }).catch(() => {});
      };
      counts(true);
      setInterval(() => { if (document.visibilityState === "visible") counts(false); }, 60_000);
    });
    for (const id of ["q", "city", "kind"]) document.getElementById(id).addEventListener("input", () => render());
  </script>
</body>
