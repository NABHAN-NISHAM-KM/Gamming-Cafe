<!doctype html>
<html lang="en" data-demo="shell">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gaming Shell demo — ArenaOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Mirrors apps/shell/src/styles.css — dark arena at night, one neon accent. */
    :root {
      --void: #07060d; --deck: #100e1b; --deck-2: #181527; --rim: #2a2540; --glow: #7cf6ff; --glow-2: #a78bfa;
      --text: #ecebf7; --dim: #9b97b8; --mute: #625e80; --warn: #ffb547; --alarm: #ff4d6d; --good: #46e3a1;
      --font: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif; --display: Bahnschrift, "Space Grotesk", "Segoe UI", sans-serif; --mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    }
    html[dir=rtl] { --font: "Noto Kufi Arabic", "Segoe UI", sans-serif; --display: "Noto Kufi Arabic", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--void); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; }
    button, input { font: inherit; color: inherit; }
    input { user-select: text; }
    :focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
    .stage { position: relative; height: calc(100vh - 40px); overflow: hidden; }
    .aurora { position: absolute; inset: -20%; z-index: 0; pointer-events: none;
      background: radial-gradient(35% 45% at 25% 25%, rgb(167 139 250 / .35), transparent 70%), radial-gradient(30% 40% at 80% 75%, rgb(124 246 255 / .22), transparent 70%), radial-gradient(25% 30% at 70% 15%, rgb(255 77 109 / .12), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate3d(-4%, -2%, 0) scale(1); } to { transform: translate3d(4%, 3%, 0) scale(1.08); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .aurora, .pulse { animation: none !important; } }
    .glass { background: color-mix(in oklab, var(--deck) 78%, transparent); backdrop-filter: blur(18px); border: 1px solid var(--rim); }
    .screen { position: absolute; inset: 0; z-index: 1; display: none; }
    .screen.on { display: flex; }

    /* lock */
    #lock { flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .top-row { position: absolute; top: 20px; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 14px; }
    .venue { display: flex; align-items: center; gap: 12px; }
    .venue i { width: 38px; height: 38px; border-radius: 11px; background: conic-gradient(from 210deg, var(--glow), var(--glow-2), var(--glow)); display: grid; place-items: center; color: var(--void); font: 800 17px var(--display); font-style: normal; }
    .venue b { color: var(--text); font: 700 17px var(--display); display: block; }
    .clock { font: 300 clamp(64px, 11vw, 132px)/1 var(--display); letter-spacing: -.03em; }
    .date { color: var(--dim); margin: 8px 0 34px; font-size: 18px; }
    .login { width: min(420px, 100%); border-radius: 22px; padding: 26px; }
    .login h2 { margin: 0 0 4px; font: 700 22px var(--display); }
    .login p { margin: 0 0 18px; color: var(--dim); font-size: 14px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--void); border: 1px solid var(--rim); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
    .tabs button { background: none; border: 0; padding: 8px; border-radius: 9px; cursor: pointer; color: var(--dim); font-weight: 600; }
    .tabs button.on { background: var(--deck-2); color: var(--glow); }
    .field { width: 100%; background: var(--void); border: 1px solid var(--rim); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; font-size: 16px; }
    .field:focus { outline: none; border-color: var(--glow); }
    .pin { display: flex; gap: 10px; justify-content: center; margin: 4px 0 14px; }
    .pin span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--rim); }
    .pin span.f { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 12px var(--glow); }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pad button { padding: 12px; border-radius: 12px; border: 1px solid var(--rim); background: var(--deck-2); cursor: pointer; font: 600 18px var(--display); }
    .pad button:hover { border-color: var(--glow); }
    .go { width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px; background: linear-gradient(90deg, var(--glow), var(--glow-2)); color: var(--void); font: 700 16px var(--display); cursor: pointer; }
    .hint { margin-top: 12px; font-size: 12.5px; color: var(--mute); text-align: center; }
    .err { color: var(--alarm); font-size: 13.5px; min-height: 20px; text-align: center; }
    .lang { display: flex; gap: 4px; }
    .lang button, .chipb { background: var(--deck-2); border: 1px solid var(--rim); border-radius: 9px; padding: 5px 11px; cursor: pointer; color: var(--dim); font-size: 13px; }
    .lang button.on { color: var(--glow); border-color: var(--glow); }
    .rates { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 13px; padding: 0 16px; }
    .rates span { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rim); background: color-mix(in oklab, var(--deck) 60%, transparent); }

    /* session */
    #session { flex-direction: row; }
    .rail { width: 250px; padding: 22px 16px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--rim); background: color-mix(in oklab, var(--deck) 70%, transparent); backdrop-filter: blur(18px); }
    html[dir=rtl] .rail { border-right: 0; border-left: 1px solid var(--rim); }
    .ringbox { display: grid; place-items: center; margin: 12px 0 18px; position: relative; }
    .ringbox .t { position: absolute; text-align: center; }
    .ringbox .t b { display: block; font: 700 26px var(--mono); font-variant-numeric: tabular-nums; }
    .ringbox .t small { color: var(--dim); font-size: 12px; }
    .who { text-align: center; margin-bottom: 16px; }
    .who b { display: block; font: 700 18px var(--display); }
    .who span { color: var(--glow); font-size: 13px; }
    .menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border: 0; border-radius: 12px; background: none; color: var(--dim); cursor: pointer; text-align: start; font-size: 15px; }
    .menu button:hover { background: var(--deck-2); color: var(--text); }
    .menu button.on { background: var(--deck-2); color: var(--glow); box-shadow: inset 3px 0 0 var(--glow); }
    .rail .bottom { margin-top: auto; display: grid; gap: 8px; }
    .rail .bottom button { padding: 11px; border-radius: 12px; border: 1px solid var(--rim); background: var(--deck-2); cursor: pointer; font-weight: 600; }
    .rail .bottom .out { color: var(--alarm); border-color: #5a2233; }
    .content { flex: 1; padding: 26px 30px; overflow-y: auto; min-width: 0; }
    .content h1 { font: 700 28px var(--display); margin: 0 0 4px; }
    .content .lead { color: var(--dim); margin: 0 0 22px; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .game { border-radius: 16px; overflow: hidden; border: 1px solid var(--rim); background: var(--deck); cursor: pointer; text-align: start; padding: 0; transition: transform .15s, border-color .15s; }
    .game:hover { transform: translateY(-3px); border-color: var(--glow); }
    .game .art { aspect-ratio: 3/4; display: grid; place-items: center; font-size: 54px; background: var(--g); position: relative; }
    .game .art em { position: absolute; top: 8px; inset-inline-start: 8px; font-style: normal; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgb(0 0 0 / .5); color: var(--good); }
    .game div.m { padding: 10px 12px; }
    .game b { display: block; font-size: 14.5px; }
    .game small { color: var(--mute); }
    .feat { border-radius: 20px; padding: 26px; margin-bottom: 22px; background: linear-gradient(120deg, rgb(255 77 109 / .35), rgb(167 139 250 / .25) 60%, transparent), var(--deck); border: 1px solid var(--rim); display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
    .feat h2 { margin: 4px 0; font: 700 26px var(--display); }
    .btnp { padding: 12px 22px; border: 0; border-radius: 12px; background: var(--glow); color: var(--void); font: 700 15px var(--display); cursor: pointer; }
    .btng { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--rim); background: var(--deck-2); cursor: pointer; font-weight: 600; }
    .search { width: 100%; max-width: 360px; margin-bottom: 18px; }
    .food { display: grid; grid-template-columns: 1fr 320px; gap: 18px; }
    .menu-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .fi { border-radius: 16px; border: 1px solid var(--rim); background: var(--deck); padding: 16px; cursor: pointer; text-align: start; }
    .fi:hover { border-color: var(--glow); }
    .fi .e { font-size: 34px; }
    .fi b { display: block; margin-top: 8px; }
    .fi span { color: var(--glow); font-family: var(--mono); font-size: 14px; }
    .basket { border-radius: 18px; padding: 18px; align-self: start; }
    .bl { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--rim); font-size: 14px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { border-radius: 16px; padding: 18px; }
    .card h3 { margin: 0 0 6px; font: 600 16px var(--display); }
    .card p { margin: 0 0 12px; color: var(--dim); font-size: 13.5px; }
    .stat b { display: block; font: 700 26px var(--mono); }
    .stat small { color: var(--dim); }
    .toast { position: absolute; top: 18px; left: 50%; transform: translate(-50%, -140%); z-index: 20; padding: 14px 22px; border-radius: 14px; transition: transform .3s; display: flex; gap: 12px; align-items: center; max-width: 92vw; }
    .toast.show { transform: translate(-50%, 0); }
    .toast.warn { border-color: var(--warn); color: var(--warn); }
    .toast.alarm { border-color: var(--alarm); color: var(--alarm); }
    .overlay { position: absolute; inset: 0; z-index: 15; display: none; place-items: center; background: rgb(7 6 13 / .75); backdrop-filter: blur(6px); }
    .overlay.on { display: grid; }
    .overlay .box { text-align: center; padding: 30px; border-radius: 22px; width: min(420px, 92vw); }
    .spinner { width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--rim); border-top-color: var(--glow); animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ending .ringbox .t b { color: var(--alarm); animation: pulse 1.2s ease-in-out infinite; }
    .demo-ctl { position: absolute; bottom: 14px; inset-inline-end: 14px; z-index: 12; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .demo-ctl button { font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px dashed #574a17; background: #1c1708; color: #facc15; cursor: pointer; }
    .mob-menu { display: none; }
    @media (max-width: 820px) {
      #session { flex-direction: column; }
      .rail { width: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--rim); gap: 8px; }
      .ringbox { margin: 0; transform: scale(.55); margin: -30px -24px; }
      .who { margin: 0; text-align: start; }
      .menu { display: flex; overflow-x: auto; width: 100%; gap: 4px; order: 5; }
      .menu button { padding: 8px 12px; white-space: nowrap; width: auto; }
      .rail .bottom { margin: 0 0 0 auto; grid-auto-flow: column; }
      .rail .bottom button { padding: 8px 10px; font-size: 13px; }
      .content { padding: 18px 16px 70px; }
      .food, .grid3 { grid-template-columns: 1fr; }
      .top-row { left: 16px; right: 16px; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="aurora"></div>

    <!-- LOCK -->
    <section class="screen on" id="lock">
      <div class="top-row">
        <div class="venue"><i>A</i><div><b>Demo Arena</b><span data-t="station">Station VIP-04 · Dubai Marina</span></div></div>
        <div class="lang"><button class="on" data-l="en">EN</button><button data-l="ar">عربي</button></div>
      </div>
      <div class="clock" id="clock">20:14</div>
      <div class="date" id="date"></div>
      <div class="login glass">
        <h2 data-t="welcome">Ready to play?</h2>
        <p data-t="signin">Sign in with your ArenaOS account.</p>
        <div class="tabs"><button class="on" data-m="pin" data-t="pinTab">Username + PIN</button><button data-m="pw" data-t="pwTab">Password</button></div>
        <input class="field" id="user" value="ahmed" autocomplete="off" data-ph="username" placeholder="Username" />
        <div id="pinMode"><div class="pin" id="pinDots"><span></span><span></span><span></span><span></span></div>
          <div class="pad" id="pad"></div></div>
        <div id="pwMode" style="display:none"><input class="field" id="pw" type="password" data-ph="password" placeholder="Password" /></div>
        <div class="err" id="err"></div>
        <button class="go" id="goBtn" data-t="unlock">Unlock</button>
        <div class="hint"><span data-t="demoHint">Demo:</span> ahmed · PIN 1234 · <span data-t="or">or password</span> ahmed123</div>
      </div>
      <div class="rates"><span data-t="rate1">VIP PC · AED 25 / hour</span><span data-t="rate2">Happy hour 2–5pm · −30%</span><span data-t="rate3">Ask staff for a night pass</span></div>
    </section>

    <!-- SESSION -->
    <section class="screen" id="session">
      <nav class="rail">
        <div class="ringbox"><svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" stroke="#2a2540" stroke-width="10" fill="none" /><circle id="ring" cx="85" cy="85" r="74" stroke="url(#rg)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="0" transform="rotate(-90 85 85)" /><defs><linearGradient id="rg"><stop offset="0" stop-color="#7cf6ff" /><stop offset="1" stop-color="#a78bfa" /></linearGradient></defs></svg>
          <div class="t"><b id="left">2:00:00</b><small data-t="remaining">remaining</small></div></div>
        <div class="who"><b id="whoName">Ahmed Hassan</b><span id="whoTier">Gold · 2,480 pts</span></div>
        <div class="menu" id="menu"></div>
        <div class="bottom"><button id="extendBtn" data-t="extend">+ Add time</button><button id="helpBtn" data-t="callStaff">🙋 Call staff</button><button class="out" id="outBtn" data-t="logout">Log out</button></div>
      </nav>
      <div class="content" id="content"></div>
    </section>

    <div class="overlay" id="overlay"><div class="box glass" id="overlayBox"></div></div>
    <div class="toast glass" id="toast"></div>
    <div class="demo-ctl" id="demoCtl" style="display:none"><button id="ff5">⏩ Demo: jump to 5 min left</button><button id="ff1">⏩ 30 s left</button></div>
  </div>

  <script src="demo-bar.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const STR = {
      en: { station: "Station VIP-04 · Dubai Marina", welcome: "Ready to play?", signin: "Sign in with your ArenaOS account.", pinTab: "Username + PIN", pwTab: "Password", unlock: "Unlock", demoHint: "Demo:", or: "or password", rate1: "VIP PC · AED 25 / hour", rate2: "Happy hour 2–5pm · −30%", rate3: "Ask staff for a night pass", remaining: "remaining", extend: "+ Add time", callStaff: "🙋 Call staff", logout: "Log out", username: "Username", password: "Password",
        home: "Home", games: "Games", apps: "Apps", food: "Order food", rewards: "Rewards", support: "Help & tools", bad: "Wrong username or PIN", noTime: "No time on your account — see the front desk.", hi: "Welcome back", launching: "Launching", w30: "30 minutes left", w15: "15 minutes left", w10: "10 minutes left", w5: "5 minutes left — ending soon", w1: "1 minute left! Save your game.", ended: "Session ended — thanks for playing!" },
      ar: { station: "المحطة VIP-04 · دبي مارينا", welcome: "جاهز للعب؟", signin: "سجّل الدخول بحساب ArenaOS.", pinTab: "اسم المستخدم + الرمز", pwTab: "كلمة المرور", unlock: "فتح", demoHint: "تجربة:", or: "أو كلمة المرور", rate1: "كمبيوتر VIP · 25 درهم / ساعة", rate2: "ساعة السعادة 2–5 مساءً · خصم 30٪", rate3: "اسأل الموظفين عن باقة الليل", remaining: "متبقي", extend: "+ إضافة وقت", callStaff: "🙋 طلب موظف", logout: "تسجيل الخروج", username: "اسم المستخدم", password: "كلمة المرور",
        home: "الرئيسية", games: "الألعاب", apps: "التطبيقات", food: "اطلب طعام", rewards: "المكافآت", support: "المساعدة والأدوات", bad: "اسم المستخدم أو الرمز غير صحيح", noTime: "لا يوجد وقت في حسابك — راجع الاستقبال.", hi: "أهلاً بعودتك", launching: "جارٍ التشغيل", w30: "متبقي 30 دقيقة", w15: "متبقي 15 دقيقة", w10: "متبقي 10 دقائق", w5: "متبقي 5 دقائق — ستنتهي الجلسة قريباً", w1: "دقيقة واحدة متبقية! احفظ لعبتك.", ended: "انتهت الجلسة — شكراً للعب!" },
    };
    let lang = "en";
    const t = (k) => STR[lang][k] ?? STR.en[k] ?? k;
    function applyLang() {
      document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
      document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t(el.dataset.ph));
      document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
      if (session) renderMenu(), show(tab);
    }
    document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; applyLang(); });

    function tickClock() {
      const d = new Date();
      $("#clock").textContent = d.toLocaleTimeString(lang === "ar" ? "ar-AE" : "en-GB", { hour: "2-digit", minute: "2-digit" });
      $("#date").textContent = d.toLocaleDateString(lang === "ar" ? "ar-AE" : "en-GB", { weekday: "long", day: "numeric", month: "long" });
    }
    tickClock(); setInterval(tickClock, 1000);

    // login
    let mode = "pin", pin = "";
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); $("#pinMode").style.display = mode === "pin" ? "" : "none"; $("#pwMode").style.display = mode === "pw" ? "" : "none"; });
    $("#pad").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "✓"].map(k => `<button data-k="${k}">${k}</button>`).join("");
    $("#pad").onclick = (e) => { const k = e.target.dataset.k; if (!k) return; if (k === "⌫") pin = pin.slice(0, -1); else if (k === "✓") return login(); else if (pin.length < 4) pin += k; dots(); if (pin.length === 4) setTimeout(login, 150); };
    document.addEventListener("keydown", (e) => { if (!$("#lock").classList.contains("on") || mode !== "pin" || document.activeElement === $("#user")) return; if (/^\d$/.test(e.key) && pin.length < 4) { pin += e.key; dots(); if (pin.length === 4) setTimeout(login, 150); } if (e.key === "Backspace") { pin = pin.slice(0, -1); dots(); } });
    const dots = () => document.querySelectorAll("#pinDots span").forEach((s, i) => s.classList.toggle("f", i < pin.length));
    $("#goBtn").onclick = login;
    $("#pw").onkeydown = (e) => e.key === "Enter" && login();

    const USERS = { ahmed: { name: "Ahmed Hassan", tier: "Gold", pts: 2480, pin: "1234", pw: "ahmed123", min: 120 }, sara: { name: "Sara Malik", tier: "Silver", pts: 640, pin: "5678", pw: "sara1234", min: 0 } };
    let session = null, tab = "home", warned = new Set(), fails = 0;
    function login() {
      const u = USERS[$("#user").value.trim().toLowerCase()];
      const ok = u && (mode === "pin" ? pin === u.pin : $("#pw").value === u.pw);
      if (!ok) { fails++; $("#err").textContent = t("bad") + (fails >= 3 ? " · " + (lang === "ar" ? "انتظر 30 ثانية" : "wait 30 s (throttled)") : ""); pin = ""; dots(); return; }
      if (!u.min) { $("#err").textContent = t("noTime"); pin = ""; dots(); return; }
      $("#err").textContent = ""; pin = ""; dots(); fails = 0;
      session = { u, total: u.min * 60000, end: Date.now() + u.min * 60000, orders: [] };
      warned = new Set();
      $("#whoName").textContent = u.name; $("#whoTier").textContent = `${u.tier} · ${u.pts.toLocaleString()} pts`;
      $("#lock").classList.remove("on"); $("#session").classList.add("on"); $("#demoCtl").style.display = "flex";
      tab = "home"; renderMenu(); show("home");
      toast(`👋 ${t("hi")}, ${u.name.split(" ")[0]}!`);
    }

    // session
    const MENU = [["home", "🏠"], ["games", "🎮"], ["apps", "🧩"], ["food", "🍔"], ["rewards", "⭐"], ["support", "🛠"]];
    function renderMenu() { $("#menu").innerHTML = MENU.map(([k, i]) => `<button class="${k === tab ? "on" : ""}" data-tab="${k}"><span>${i}</span>${t(k)}</button>`).join(""); document.querySelectorAll("#menu button").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderMenu(); show(tab); }); }
    const G = [["Valorant", "🎯", "#ff4655,#2b0b12", "Riot"], ["Counter-Strike 2", "💥", "#f59e0b,#1f1400", "Steam"], ["League of Legends", "⚔️", "#0ea5e9,#081a2b", "Riot"], ["Fortnite", "🦙", "#8b5cf6,#170b30", "Epic"], ["EA SPORTS FC 26", "⚽", "#22c55e,#062012", "EA"], ["Apex Legends", "🔺", "#ef4444,#260808", "Steam"], ["Dota 2", "🛡", "#dc2626,#1a0606", "Steam"], ["Rocket League", "🚗", "#3b82f6,#07142b", "Epic"], ["Minecraft", "⛏", "#65a30d,#0f1a05", "Microsoft"], ["Call of Duty", "🪖", "#78716c,#141210", "Battle.net"], ["Overwatch 2", "🦾", "#f97316,#1f0d02", "Battle.net"], ["Rainbow Six Siege", "🔫", "#64748b,#0e1116", "Ubisoft"]];
    const gameCard = ([n, e, g, l], i) => `<button class="game" data-g="${n}"><div class="art" style="--g:linear-gradient(160deg,${g})">${e}${i < 3 ? `<em>${lang === "ar" ? "محدّث" : "Updated"}</em>` : ""}</div><div class="m"><b>${n}</b><small>${l}</small></div></button>`;
    const FOOD = [["🍔", "Chicken burger", 32], ["🍕", "Pepperoni pizza", 45], ["🍟", "Fries", 14], ["🍗", "Wings (8)", 36], ["🌮", "Loaded nachos", 28], ["🥤", "Red Bull", 12], ["🧋", "Iced latte", 18], ["💧", "Water", 4]];
    let basket = [];
    function show(k) {
      const c = $("#content"), first = session.u.name.split(" ")[0];
      if (k === "home") c.innerHTML = `<h1>${t("hi")}, ${first} 👋</h1><p class="lead">${lang === "ar" ? "ماذا ستلعب الليلة؟" : "What are we playing tonight?"}</p>
        <div class="feat"><div><small style="color:var(--warn)">${lang === "ar" ? "بطولة الجمعة" : "FRIDAY VALORANT CUP"}</small><h2>${lang === "ar" ? "جائزة 2,000 درهم" : "AED 2,000 prize pool"}</h2><div style="color:var(--dim)">${lang === "ar" ? "سجّل فريقك من التطبيق" : "8 teams · check in from the customer app"}</div></div><button class="btnp" data-g="Valorant">▶ ${lang === "ar" ? "العب Valorant" : "Play Valorant"}</button></div>
        <h3 style="font:600 17px var(--display);margin:0 0 12px">${lang === "ar" ? "الأكثر لعباً" : "Popular right now"}</h3><div class="games">${G.slice(0, 6).map(gameCard).join("")}</div>`;
      if (k === "games") c.innerHTML = `<h1>${t("games")}</h1><p class="lead">${G.length} ${lang === "ar" ? "لعبة مثبتة ومحدّثة" : "games installed and up to date"}</p><input class="field search" id="gq" placeholder="${lang === "ar" ? "ابحث…" : "Search games…"}" /><div class="games" id="glist">${G.map(gameCard).join("")}</div>`;
      if (k === "apps") c.innerHTML = `<h1>${t("apps")}</h1><p class="lead">${lang === "ar" ? "تطبيقات مسموحة من الإدارة" : "Apps approved by the venue"}</p><div class="games">${[["Discord", "💬", "#5865f2,#0f1233", "Voice"], ["Spotify", "🎵", "#1db954,#04200e", "Music"], ["Chrome", "🌐", "#fbbc05,#231a02", "Browser"], ["OBS Studio", "🎥", "#6b7280,#111", "Streaming"], ["Microsoft Word", "📝", "#2b579a,#07142b", "Office"], ["Twitch", "📺", "#9146ff,#170b30", "Streaming"]].map(gameCard).join("")}</div>`;
      if (k === "food") { c.innerHTML = `<h1>${t("food")}</h1><p class="lead">${lang === "ar" ? "يصل الطلب إلى مقعدك · يُضاف إلى فاتورتك" : "Delivered to VIP-04 · added to your bill"}</p><div class="food"><div class="menu-items">${FOOD.map(([e, n, p], i) => `<button class="fi" data-f="${i}"><div class="e">${e}</div><b>${n}</b><span>AED ${p}</span></button>`).join("")}</div><div class="basket glass" id="basket"></div></div>`; renderBasket(); }
      if (k === "rewards") c.innerHTML = `<h1>${t("rewards")}</h1><p class="lead">${session.u.pts.toLocaleString()} ${lang === "ar" ? "نقطة" : "points"} · ${session.u.tier} (1.5×)</p><div class="grid3">${[["⏱", "30 free minutes", 600], ["💳", "AED 20 wallet credit", 1500], ["🍔", "Free burger", 1200], ["🥤", "Free Red Bull", 400], ["👑", "VIP upgrade 1h", 2000], ["🎟", "Tournament entry", 2500]].map(([e, n, p]) => `<div class="card glass"><div style="font-size:30px">${e}</div><h3>${n}</h3><p>${p.toLocaleString()} pts</p><button class="btng" data-r="${n}|${p}" ${session.u.pts < p ? "disabled style='opacity:.4'" : ""}>${lang === "ar" ? "استبدال" : "Redeem"}</button></div>`).join("")}</div>`;
      if (k === "support") c.innerHTML = `<h1>${t("support")}</h1><p class="lead">${lang === "ar" ? "أصلح المشاكل الشائعة بنفسك" : "Fix common issues yourself — no need to wait for staff."}</p>
        <div class="grid3" style="margin-bottom:14px"><div class="card glass stat"><small>Ping · Dubai</small><b id="ping">8 ms</b></div><div class="card glass stat"><small>Download</small><b>940 Mbps</b></div><div class="card glass stat"><small>GPU</small><b>RTX 4080 · 64°C</b></div></div>
        <div class="grid3">${[["🎧", "Headset not working", "Reset audio device & default output"], ["🖱", "Mouse / keyboard", "Reload peripheral profile"], ["🖥", "Display issue", "Reset resolution & refresh rate (240 Hz)"], ["🌐", "Lag / disconnects", "Flush DNS & renew network"], ["🎮", "Game won't start", "Verify files & restart launcher"], ["🎙", "Mic too quiet", "Apply venue mic profile"]].map(([e, n, d]) => `<div class="card glass"><div style="font-size:28px">${e}</div><h3>${n}</h3><p>${d}</p><button class="btng" data-fix="${n}">${lang === "ar" ? "إصلاح" : "Fix it"}</button></div>`).join("")}</div>`;
      bindContent();
    }
    function bindContent() {
      document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => launch(b.dataset.g));
      const gq = $("#gq"); if (gq) gq.oninput = () => { const q = gq.value.toLowerCase(); $("#glist").innerHTML = G.filter(g => g[0].toLowerCase().includes(q)).map(gameCard).join(""); bindContent(); };
      document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const f = FOOD[+b.dataset.f]; const l = basket.find(x => x[1] === f[1]); l ? l[3]++ : basket.push([...f, 1]); renderBasket(); });
      document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const [n, p] = b.dataset.r.split("|"); session.u.pts -= +p; if (n.includes("minutes")) session.end += 30 * 60000, session.total += 30 * 60000; $("#whoTier").textContent = `${session.u.tier} · ${session.u.pts.toLocaleString()} pts`; toast(`⭐ ${n} redeemed!`); show("rewards"); });
      document.querySelectorAll("[data-fix]").forEach(b => b.onclick = () => { b.disabled = true; b.textContent = "…"; setTimeout(() => { b.textContent = "✓ " + (lang === "ar" ? "تم" : "Fixed"); toast(`🛠 ${b.dataset.fix}: ${lang === "ar" ? "تم الإصلاح" : "repaired"}`); }, 1400); });
    }
    function renderBasket() {
      const el = $("#basket"); if (!el) return;
      const tot = basket.reduce((a, l) => a + l[2] * l[3], 0);
      el.innerHTML = `<h3 style="margin:0 0 10px;font:600 17px var(--display)">${lang === "ar" ? "سلتك" : "Your order"}</h3>` + (basket.length ? basket.map((l, i) => `<div class="bl"><span>${l[3]}× ${l[1]}</span><span style="display:flex;gap:8px;align-items:center"><span style="font-family:var(--mono)">AED ${l[2] * l[3]}</span><button class="chipb" data-rm="${i}">✕</button></span></div>`).join("") + `<div class="bl" style="border:0;font-weight:700;font-size:17px"><span>Total</span><span>AED ${tot}</span></div><button class="btnp" style="width:100%" id="placeOrder">${lang === "ar" ? "أرسل الطلب" : "Send to kitchen"}</button>` : `<p style="color:var(--dim)">${lang === "ar" ? "اختر من القائمة" : "Tap an item to add it."}</p>`);
      document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { basket.splice(+b.dataset.rm, 1); renderBasket(); });
      const po = $("#placeOrder"); if (po) po.onclick = () => {
        const no = 1041 + session.orders.length; session.orders.push(no); basket = []; renderBasket();
        toast(`🍔 ${lang === "ar" ? "تم إرسال الطلب" : "Order"} #${no} ${lang === "ar" ? "" : "sent to the kitchen"}`);
        setTimeout(() => toast(`👨‍🍳 #${no} ${lang === "ar" ? "قيد التحضير" : "is being prepared"}`), 4000);
        setTimeout(() => toast(`✅ #${no} ${lang === "ar" ? "في الطريق إليك" : "is on its way to VIP-04!"}`), 9000);
      };
    }
    function launch(name) {
      overlay(`<div class="spinner"></div><h2 style="margin:0;font:700 22px var(--display)">${t("launching")} ${name}</h2><p style="color:var(--dim)">${lang === "ar" ? "جارٍ التحقق من الملفات الموقّعة…" : "Verifying signed install… syncing cloud save…"}</p>`);
      setTimeout(() => overlay(`<div style="font-size:54px">🎮</div><h2 style="margin:0;font:700 22px var(--display)">${name} ${lang === "ar" ? "يعمل" : "is running"}</h2><p style="color:var(--dim)">${lang === "ar" ? "في الشاشة الحقيقية تختفي الواجهة وتظهر اللعبة." : "On a real PC the Shell steps aside and the game takes over. Your timer keeps running."}</p><button class="btnp" onclick="overlay()">${lang === "ar" ? "العودة" : "Back to Shell"}</button>`), 1800);
    }
    window.overlay = (html) => { $("#overlay").classList.toggle("on", !!html); if (html) $("#overlayBox").innerHTML = html; };
    function toast(msg, tone = "") { const el = $("#toast"); el.className = "toast glass show " + tone; el.textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 3800); }

    $("#extendBtn").onclick = () => overlay(`<h2 style="margin:0 0 6px;font:700 22px var(--display)">${t("extend")}</h2><p style="color:var(--dim)">${lang === "ar" ? "يُخصم من محفظتك · AED 170" : "Paid from your wallet · balance AED 170.00"}</p><div style="display:grid;gap:8px">${[[30, 12.5], [60, 25], [180, 70]].map(([m, p]) => `<button class="btng" onclick="addTime(${m},${p})">+${m >= 60 ? m / 60 + (lang === "ar" ? " ساعة" : " h") : m + " min"} · AED ${p}</button>`).join("")}</div><button class="btng" style="margin-top:10px;background:none" onclick="overlay()">${lang === "ar" ? "إلغاء" : "Cancel"}</button>`);
    window.addTime = (m, p) => { session.end += m * 60000; session.total += m * 60000; warned = new Set([...warned].filter(x => x * 60000 > session.end - Date.now())); overlay(); toast(`⏱ +${m} min · AED ${p} ${lang === "ar" ? "من المحفظة" : "from wallet"}`); $("#session").classList.remove("ending"); };
    $("#helpBtn").onclick = () => { toast(lang === "ar" ? "🙋 تم إبلاغ الموظفين — في الطريق إليك" : "🙋 Staff notified on the Live Floor — someone's coming to VIP-04"); };
    $("#outBtn").onclick = () => endSession(false);
    function endSession(expired) {
      const left = Math.max(0, Math.round((session.end - Date.now()) / 60000));
      overlay(); $("#session").classList.remove("on", "ending"); $("#lock").classList.add("on"); $("#demoCtl").style.display = "none";
      $("#err").textContent = "";
      toast(expired ? `🔒 ${t("ended")}` : `🔒 ${t("ended")}${left ? ` · ${left} min ${lang === "ar" ? "أعيدت إلى حسابك" : "returned to your account"}` : ""}`);
      if (!expired) session.u.min = left || session.u.min; else session.u.min = 120;
      session = null;
    }
    $("#ff5").onclick = () => { session.end = Date.now() + 5 * 60000 - 500; warned = new Set([30, 15, 10]); };
    $("#ff1").onclick = () => { session.end = Date.now() + 30000; warned = new Set([30, 15, 10, 5]); };

    setInterval(() => {
      if (!session) return;
      const left = session.end - Date.now();
      if (left <= 0) return endSession(true);
      const s = Math.floor(left / 1000);
      $("#left").textContent = `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      $("#ring").setAttribute("stroke-dashoffset", 465 * (1 - Math.min(1, left / session.total)));
      $("#session").classList.toggle("ending", left < 5 * 60000);
      for (const m of [30, 15, 10, 5, 1]) if (left <= m * 60000 && !warned.has(m)) { warned.add(m); toast(`⏱ ${t("w" + m)}`, m <= 1 ? "alarm" : m <= 5 ? "warn" : ""); }
    }, 250);
    applyLang();
  </script>
</body>
</html>
