<!doctype html>
<html lang="en" data-demo="superadmin">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Admin demo — ArenaOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0b12; --panel: #11131e; --panel-2: #171a28; --line: #23273a; --line-2: #30354d;
      --ink: #e8e9f5; --ink-2: #a8abc6; --ink-3: #6e7291; --acc: #a78bfa; --acc-ink: #1a0f3a; --acc-soft: #2a2150;
      --ok: #34d399; --warn: #facc15; --bad: #f87171; --cyan: #22d3ee;
      --font: Inter, system-ui, sans-serif; --display: "Space Grotesk", Inter, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .app { display: grid; grid-template-columns: 232px 1fr; min-height: calc(100vh - 40px); }
    aside { border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; background: #0c0d16; position: sticky; top: 40px; height: calc(100vh - 40px); }
    .logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-family: var(--display); font-weight: 700; font-size: 16px; }
    .logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; font-style: normal; }
    .logo small { display: block; font: 500 11px var(--font); color: var(--acc); letter-spacing: .08em; text-transform: uppercase; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); cursor: pointer; text-align: left; }
    .nav button:hover { background: var(--panel); color: var(--ink); }
    .nav button.on { background: var(--acc-soft); color: var(--acc); }
    .nav .sec { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; padding: 16px 12px 6px; }
    .me { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
    .me b { color: var(--ink); display: block; font-size: 13.5px; }
    main { padding: 26px 30px 60px; min-width: 0; }
    h1 { font: 700 24px var(--display); margin: 0; letter-spacing: -.02em; }
    .sub { color: var(--ink-3); margin: 4px 0 22px; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .kpi small { color: var(--ink-3); }
    .kpi b { display: block; font: 700 26px var(--display); margin-top: 4px; }
    .kpi em { font-style: normal; font-size: 12px; color: var(--ok); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    .panel h3 { margin: 0 0 14px; font: 600 15px var(--display); }
    .two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: var(--panel-2); }
    .tw { overflow-x: auto; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid; }
    .chip.ok { color: var(--ok); border-color: #1f5f49; background: #0c2a20; }
    .chip.warn { color: var(--warn); border-color: #5a4d16; background: #282208; }
    .chip.bad { color: var(--bad); border-color: #6a2a2a; background: #2a1215; }
    .chip.p { color: var(--acc); border-color: #463a7a; background: var(--acc-soft); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; font-weight: 500; }
    .btn:hover { border-color: var(--ink-3); }
    .btn.pri { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 600; }
    .btn.danger { color: var(--bad); border-color: #6a2a2a; }
    .btn.okb { color: var(--ok); border-color: #1f5f49; }
    .tools { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .tools input, .tools select, .field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; color-scheme: dark; }
    .tools input { min-width: 240px; }
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 190px; padding-top: 10px; }
    .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .bars i { width: 100%; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, var(--acc), #5b3fb8); }
    .bars span { font-size: 11px; color: var(--ink-3); }
    .list { display: grid; gap: 10px; }
    .li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 13px; }
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .plan h3 { display: flex; justify-content: space-between; align-items: center; }
    .plan .price { font: 700 30px var(--display); }
    .plan .lim { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
    .plan .lim div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; font-size: 11.5px; color: var(--ink-3); }
    .plan .lim b { display: block; font: 600 15px var(--display); color: var(--ink); }
    .flags { display: grid; gap: 2px; max-height: 360px; overflow: auto; margin-top: 8px; }
    .flag { display: flex; justify-content: space-between; align-items: center; padding: 7px 4px; border-bottom: 1px dashed var(--line); font-size: 13px; }
    .sw { position: relative; width: 36px; height: 20px; flex: none; }
    .sw input { opacity: 0; width: 0; height: 0; }
    .sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); cursor: pointer; transition: .2s; }
    .sw span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; }
    .sw input:checked + span { background: var(--acc); }
    .sw input:checked + span::after { transform: translateX(16px); }
    .drawer { position: fixed; top: 40px; right: 0; bottom: 0; width: min(520px, 100%); background: var(--panel); border-left: 1px solid var(--line-2); transform: translateX(100%); transition: transform .25s; z-index: 50; overflow-y: auto; padding: 22px; box-shadow: -30px 0 80px rgb(0 0 0 / .5); }
    .drawer.open { transform: none; }
    .drawer .x { float: right; background: none; border: 0; color: var(--ink-3); font-size: 22px; cursor: pointer; }
    .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .dl div { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
    .dl small { color: var(--ink-3); display: block; font-size: 11.5px; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .modal-bg { position: fixed; inset: 0; background: rgb(3 4 10 / .7); display: none; place-items: center; z-index: 80; backdrop-filter: blur(2px); }
    .modal-bg.open { display: grid; }
    .modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; padding: 22px; width: min(440px, 92vw); }
    .modal h3 { margin: 0 0 6px; font-family: var(--display); }
    .field { display: grid; gap: 6px; margin: 14px 0; color: var(--ink-2); font-size: 13px; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(120px); background: #0c2a20; color: #a7f3d0; border: 1px solid #1f5f49; padding: 11px 18px; border-radius: 10px; transition: transform .25s; z-index: 90; }
    .toast.show { transform: translateX(-50%); }
    .imp { display: none; background: repeating-linear-gradient(45deg, #3b2a06, #3b2a06 12px, #2a1f06 12px, #2a1f06 24px); color: #fde68a; border: 1px solid #6b5313; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; align-items: center; justify-content: space-between; gap: 12px; }
    .imp.show { display: flex; }
    .bar-pct { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; width: 120px; }
    .bar-pct i { display: block; height: 100%; background: var(--acc); }
    .mono { font-family: var(--mono); font-size: 12.5px; }
    .dim { color: var(--ink-3); }
    .menu-t { display: none; }
    @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } .two, .plans { grid-template-columns: 1fr; } }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      aside { position: fixed; z-index: 60; width: 240px; transform: translateX(-100%); transition: .2s; }
      aside.open { transform: none; }
      .menu-t { display: inline-flex; }
      main { padding: 18px 16px 60px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="side">
      <div class="logo"><i>A</i><div>ArenaOS<small>Platform</small></div></div>
      <div class="nav" id="nav"></div>
      <div class="me"><b>Priya Platform</b>platform@arenaos.demo<br />Super Admin · MFA ✓</div>
    </aside>
    <main id="main"></main>
  </div>

  <div class="drawer" id="drawer"></div>
  <div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
  <div class="toast" id="toast"></div>

  <script src="demo-bar.js"></script>
  <script>
    const FEATURES = [["PC_GAMING","PC gaming & Gaming Shell"],["CONSOLE","Console stations"],["VR_SIMULATOR","VR & simulators"],["INTERNET_CAFE","Internet café"],["DISKLESS","Diskless integration"],["GAME_UPDATES","Game update orchestration"],["LICENSE_POOL","Game license pool"],["BOOKINGS","Bookings"],["MEMBERSHIP","Memberships"],["WALLET","Customer wallet"],["RESTAURANT","Restaurant POS"],["KDS","Kitchen display"],["TABLES","Table management"],["INVENTORY","Inventory"],["PURCHASING","Purchasing"],["TOURNAMENTS","Tournaments"],["LOYALTY","Loyalty"],["PROMOTIONS","Promotions engine"],["CRM","CRM & campaigns"],["ACCOUNTING","Accounting"],["ADVANCED_REPORTS","Advanced analytics"],["CUSTOMER_APP","Customer app"],["REMOTE_SUPPORT","Remote support"],["PUBLIC_API","Public API & webhooks"],["OFFLINE_EDGE","Offline edge"],["MULTI_BRAND","Multiple brands"]];
    const ALL = FEATURES.map(f => f[0]);
    const STARTER = ["PC_GAMING","CONSOLE","INTERNET_CAFE","BOOKINGS","MEMBERSHIP","WALLET","INVENTORY","LOYALTY","PROMOTIONS","CUSTOMER_APP","REMOTE_SUPPORT","OFFLINE_EDGE","GAME_UPDATES"];
    const plans = {
      STARTER: { name: "Starter", price: 199, b: 1, d: 30, e: 10, f: new Set(STARTER) },
      PRO: { name: "Pro", price: 599, b: 5, d: 250, e: 100, f: new Set(ALL.filter(f => !["PUBLIC_API","MULTI_BRAND","DISKLESS","ACCOUNTING"].includes(f))) },
      ENTERPRISE: { name: "Enterprise", price: 1999, b: null, d: null, e: null, f: new Set(ALL) },
    };
    const countries = ["AE","SA","QA","KW","BH","OM","IN","GB","US"];
    const names = ["Demo Arena","Rival Gaming","Pixel Palace","Nitro Esports Hub","Respawn Café","Level Up Lounge","Falcon Arena","The Grind Room","Critical Hit KSA","Doha LAN House","Headshot Hall","Byte & Bite","Overtime Arena","Neon Nexus","Checkpoint Café","Boss Fight Club","GG Station","Quest Den"];
    const orgs = names.map((n, i) => {
      const plan = i === 0 ? "PRO" : i === 1 ? "STARTER" : ["STARTER","PRO","PRO","ENTERPRISE","STARTER"][i % 5];
      const p = plans[plan];
      const branches = plan === "STARTER" ? 1 : plan === "PRO" ? 1 + (i % 5) : 6 + (i % 9);
      const stations = Math.min(p.d ?? 9999, branches * (18 + (i * 7) % 40));
      return {
        id: "org_" + (1000 + i), name: n, slug: n.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, ""), plan,
        status: i === 5 ? "SUSPENDED" : i === 11 ? "PAST_DUE" : i === 16 ? "TRIAL" : "ACTIVE",
        country: i === 0 || i === 1 ? "AE" : countries[i % countries.length], branches, stations,
        online: Math.round(stations * (0.55 + ((i * 13) % 40) / 100)), staff: Math.min(p.e ?? 999, branches * 7),
        created: new Date(2025, (i * 5) % 12, 1 + (i * 3) % 27), overrides: {},
        owner: i === 0 ? "owner@demo.test" : i === 1 ? "owner@rival.test" : "owner@" + n.toLowerCase().replace(/[^a-z]/g, "").slice(0, 12) + ".test",
      };
    });
    const releases = [
      { c: "Windows Agent", v: "1.10.2", ch: "stable", pct: 100, d: "2026-09-18", notes: "Shell autostart policy, supervisor restarts" },
      { c: "Windows Agent", v: "1.11.0-beta.3", ch: "beta", pct: 12, d: "2026-09-24", notes: "Print job capture on Win 11 24H2" },
      { c: "Gaming Shell", v: "2.4.0", ch: "stable", pct: 100, d: "2026-09-15", notes: "Rewards and inbox messages at session start" },
      { c: "Gaming Shell", v: "2.5.0-rc.1", ch: "beta", pct: 25, d: "2026-09-25", notes: "Tournament check-in from the seat" },
      { c: "KDS", v: "1.3.1", ch: "stable", pct: 100, d: "2026-08-30", notes: "Recall bumped tickets" },
    ];
    const audit = [
      ["2026-09-26 09:12", "platform@arenaos.demo", "org.plan_change", "Pixel Palace: STARTER → PRO", "Upgrade requested by owner"],
      ["2026-09-26 08:40", "support@arenaos.demo", "impersonation.start", "Respawn Café", "Ticket #4812 — shell not unlocking"],
      ["2026-09-25 22:03", "system", "subscription.past_due", "Byte & Bite", "Card declined"],
      ["2026-09-25 17:30", "platform@arenaos.demo", "release.rollout", "Gaming Shell 2.5.0-rc.1 → 25%", "Beta cohort expansion"],
      ["2026-09-24 11:05", "platform@arenaos.demo", "org.suspend", "Level Up Lounge", "Chargeback investigation"],
    ];

    const $ = (s) => document.querySelector(s);
    const money = (n) => "$" + n.toLocaleString("en-US");
    const statusChip = (s) => `<span class="chip ${s === "ACTIVE" ? "ok" : s === "SUSPENDED" ? "bad" : s === "TRIAL" ? "p" : "warn"}">● ${s.replace("_", " ").toLowerCase()}</span>`;
    const enabled = (o) => { const s = new Set(plans[o.plan].f); for (const [k, v] of Object.entries(o.overrides)) v ? s.add(k) : s.delete(k); return s; };
    const mrr = () => orgs.filter(o => o.status !== "SUSPENDED" && o.status !== "TRIAL").reduce((a, o) => a + plans[o.plan].price, 0);
    function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }
    function log(action, target, reason) { const d = new Date(); audit.unshift([`2026-09-26 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`, "platform@arenaos.demo", action, target, reason]); }

    const PAGES = [["overview", "Overview", "◧"], ["orgs", "Organizations", "▦"], ["plans", "Plans & features", "◈"], ["billing", "Subscriptions", "$"], ["releases", "Client releases", "⇪"], ["settings", "Platform settings", "⚙"], ["audit", "Audit log", "≣"]];
    let page = "overview";
    function renderNav() {
      $("#nav").innerHTML = PAGES.map(([k, l, i], idx) => (idx === 5 ? '<div class="sec">Platform</div>' : "") + `<button class="${k === page ? "on" : ""}" data-p="${k}"><span style="width:16px;text-align:center">${i}</span>${l}</button>`).join("");
      $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { page = b.dataset.p; $("#side").classList.remove("open"); render(); });
    }
    const menuBtn = `<button class="btn menu-t" onclick="document.getElementById('side').classList.toggle('open')">☰</button>`;

    const V = {
      overview() {
        const active = orgs.filter(o => o.status === "ACTIVE").length;
        const stations = orgs.reduce((a, o) => a + o.stations, 0), online = orgs.reduce((a, o) => a + o.online, 0);
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"], vals = [5.2, 6.0, 6.8, 7.5, 8.3, 9.0, 9.9, 10.5, mrr() / 1000];
        const mx = Math.max(...vals);
        const byPlan = Object.keys(plans).map(k => [plans[k].name, orgs.filter(o => o.plan === k).length]);
        return `<div class="head">${menuBtn}<div style="flex:1"><h1>Platform overview</h1><div class="sub">All organizations on ArenaOS · live</div></div></div>
          <div class="kpis">
            <div class="kpi"><small>Organizations</small><b>${orgs.length}</b><em>${active} active</em></div>
            <div class="kpi"><small>MRR</small><b>${money(mrr())}</b><em>▲ 8.2% vs Aug</em></div>
            <div class="kpi"><small>Stations online</small><b>${online.toLocaleString()}</b><em>of ${stations.toLocaleString()} enrolled</em></div>
            <div class="kpi"><small>Needs attention</small><b style="color:var(--warn)">${orgs.filter(o => o.status !== "ACTIVE").length}</b><em style="color:var(--ink-3)">suspended, past due, trial</em></div>
          </div>
          <div class="two">
            <div class="panel"><h3>MRR, 2026 ($k)</h3><div class="bars">${vals.map((v, i) => `<div><small class="dim" style="font-size:11px">${v.toFixed(1)}</small><i style="height:${(v / mx) * 80}%"></i><span>${months[i]}</span></div>`).join("")}</div></div>
            <div class="panel"><h3>Organizations by plan</h3><div class="list">${byPlan.map(([n, c]) => `<div class="li"><span>${n}</span><span style="display:flex;align-items:center;gap:10px"><span class="bar-pct"><i style="width:${(c / orgs.length) * 100}%"></i></span><b>${c}</b></span></div>`).join("")}</div>
              <h3 style="margin-top:20px">Recent activity</h3><div class="list">${audit.slice(0, 3).map(a => `<div class="li"><span><span class="mono dim">${a[2]}</span><br />${a[3]}</span><span class="dim" style="font-size:11.5px">${a[0].slice(11)}</span></div>`).join("")}</div></div>
          </div>`;
      },
      orgs() {
        return `<div class="head">${menuBtn}<div style="flex:1"><h1>Organizations</h1><div class="sub">Create, suspend, change plans and override features per tenant.</div></div><button class="btn pri" id="newOrg">+ New organization</button></div>
          <div class="tools"><input id="q" placeholder="Search name, slug or owner…" /><select id="fp"><option value="">All plans</option>${Object.keys(plans).map(k => `<option value="${k}">${plans[k].name}</option>`).join("")}</select><select id="fs"><option value="">Any status</option><option>ACTIVE</option><option>TRIAL</option><option>PAST_DUE</option><option>SUSPENDED</option></select></div>
          <div class="panel tw" style="padding:0"><table><thead><tr><th>Organization</th><th>Plan</th><th>Status</th><th>Country</th><th>Branches</th><th>Stations</th><th>Online</th><th>Created</th></tr></thead><tbody id="orgRows"></tbody></table></div>`;
      },
      plans() {
        return `<div class="head">${menuBtn}<div style="flex:1"><h1>Plans &amp; features</h1><div class="sub">Plan defaults apply to every org on the plan. Org overrides win over plan; plan wins over catalog default.</div></div></div>
          <div class="plans">${Object.entries(plans).map(([k, p]) => `<div class="panel plan"><h3>${p.name}<span class="chip p">${orgs.filter(o => o.plan === k).length} orgs</span></h3>
            <div class="price">${money(p.price)}<span class="dim" style="font:400 13px var(--font)"> / month</span></div>
            <div class="lim"><div><b>${p.b ?? "∞"}</b>branches</div><div><b>${p.d ?? "∞"}</b>stations</div><div><b>${p.e ?? "∞"}</b>staff</div></div>
            <div class="dim" style="font-size:12px">${p.f.size} of ${ALL.length} modules enabled</div>
            <div class="flags">${FEATURES.map(([fk, fl]) => `<label class="flag"><span>${fl}</span><span class="sw"><input type="checkbox" data-plan="${k}" data-f="${fk}" ${p.f.has(fk) ? "checked" : ""}/><span></span></span></label>`).join("")}</div></div>`).join("")}</div>`;
      },
      billing() {
        const rows = orgs.map(o => { const p = plans[o.plan]; const next = new Date(2026, 9, 1 + (o.name.length % 27)); return `<tr data-id="${o.id}"><td><b>${o.name}</b></td><td>${p.name}</td><td>${statusChip(o.status)}</td><td class="mono">${money(o.status === "TRIAL" ? 0 : p.price)}</td><td class="dim">${next.toDateString().slice(4)}</td><td class="dim">${o.status === "PAST_DUE" ? "Card declined · retry in 2d" : o.status === "TRIAL" ? "Trial ends in 9 days" : "Visa •• " + (4000 + o.name.length * 37) % 10000}</td></tr>`; }).join("");
        const pd = orgs.filter(o => o.status === "PAST_DUE");
        return `<div class="head">${menuBtn}<div style="flex:1"><h1>Subscriptions</h1><div class="sub">Billing status across every organization.</div></div></div>
          <div class="kpis" style="margin-bottom:14px"><div class="kpi"><small>MRR</small><b>${money(mrr())}</b></div><div class="kpi"><small>ARR run-rate</small><b>${money(mrr() * 12)}</b></div><div class="kpi"><small>Past due</small><b style="color:var(--warn)">${pd.length}</b><em style="color:var(--ink-3)">${money(pd.reduce((a, o) => a + plans[o.plan].price, 0))} at risk</em></div><div class="kpi"><small>Trials</small><b>${orgs.filter(o => o.status === "TRIAL").length}</b></div></div>
          <div class="panel tw" style="padding:0"><table><thead><tr><th>Organization</th><th>Plan</th><th>Status</th><th>Amount</th><th>Next invoice</th><th>Payment</th></tr></thead><tbody id="billRows">${rows}</tbody></table></div>`;
      },
      releases() {
        return `<div class="head">${menuBtn}<div style="flex:1"><h1>Client releases</h1><div class="sub">Staged rollouts for the Windows agent, Gaming Shell and KDS. Venues pick up updates between sessions.</div></div><button class="btn pri" id="newRel">+ Publish release</button></div>
          <div class="panel tw" style="padding:0"><table><thead><tr><th>Component</th><th>Version</th><th>Channel</th><th>Rollout</th><th>Published</th><th>Notes</th><th></th></tr></thead><tbody>${releases.map((r, i) => `<tr style="cursor:default"><td><b>${r.c}</b></td><td class="mono">${r.v}</td><td><span class="chip ${r.ch === "stable" ? "ok" : "p"}">${r.ch}</span></td><td><span style="display:flex;align-items:center;gap:8px"><span class="bar-pct"><i style="width:${r.pct}%"></i></span>${r.pct}%</span></td><td class="dim">${r.d}</td><td class="dim">${r.notes}</td><td>${r.pct < 100 ? `<button class="btn" data-rel="${i}">Expand →</button>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
      },
      settings() {
        const cur = [["AED","UAE dirham","2"],["SAR","Saudi riyal","2"],["QAR","Qatari riyal","2"],["KWD","Kuwaiti dinar","3"],["BHD","Bahraini dinar","3"],["OMR","Omani rial","3"],["INR","Indian rupee","2"],["GBP","Pound sterling","2"],["USD","US dollar","2"]];
        const ctry = [["AE","United Arab Emirates","AED","Asia/Dubai","5% VAT"],["SA","Saudi Arabia","SAR","Asia/Riyadh","15% VAT"],["QA","Qatar","QAR","Asia/Qatar","—"],["KW","Kuwait","KWD","Asia/Kuwait","—"],["BH","Bahrain","BHD","Asia/Bahrain","10% VAT"],["OM","Oman","OMR","Asia/Muscat","5% VAT"],["IN","India","INR","Asia/Kolkata","18% GST"],["GB","United Kingdom","GBP","Europe/London","20% VAT"],["US","United States","USD","America/New_York","Sales tax"]];
        return `<div class="head">${menuBtn}<div style="flex:1"><h1>Platform settings</h1><div class="sub">Countries, currencies, taxes and payment gateways available to organizations.</div></div></div>
          <div class="two"><div class="panel tw"><h3>Countries</h3><table><thead><tr><th>Code</th><th>Country</th><th>Currency</th><th>Timezone</th><th>Tax</th></tr></thead><tbody>${ctry.map(r => `<tr style="cursor:default">${r.map((c, i) => `<td class="${i === 0 ? "mono" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
          <div><div class="panel"><h3>Currencies</h3><div class="list">${cur.map(([c, n, m]) => `<div class="li"><span><b class="mono">${c}</b> · ${n}</span><span class="dim">${m} decimals</span></div>`).join("")}</div></div>
          <div class="panel" style="margin-top:14px"><h3>Payment gateways</h3><div class="list">${[["Stripe","Live"],["Checkout.com","Live"],["Network International","Sandbox"],["Razorpay","Live"]].map(([n, s]) => `<div class="li"><span>${n}</span><span class="chip ${s === "Live" ? "ok" : "warn"}">${s}</span></div>`).join("")}</div></div></div></div>`;
      },
      audit() {
        return `<div class="head">${menuBtn}<div style="flex:1"><h1>Audit log</h1><div class="sub">Hash-chained, append-only. Every sensitive action records who, what and why.</div></div></div>
          <div class="panel tw" style="padding:0"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Reason</th><th>Hash</th></tr></thead><tbody>${audit.map((a, i) => `<tr style="cursor:default"><td class="dim">${a[0]}</td><td>${a[1]}</td><td class="mono" style="color:var(--acc)">${a[2]}</td><td>${a[3]}</td><td class="dim">${a[4]}</td><td class="mono dim">${(0x9f3a21 * (audit.length - i) * 2654435761 >>> 0).toString(16).slice(0, 8)}…</td></tr>`).join("")}</tbody></table></div>`;
      },
    };

    function render() {
      renderNav();
      $("#main").innerHTML = `<div class="imp ${imp ? "show" : ""}" id="impBar"><span>⚠ Impersonating <b>${imp ?? ""}</b> — every action is audited.</span><span style="display:flex;gap:8px"><a class="btn" href="admin.html">Open their admin →</a><button class="btn" id="endImp">End</button></span></div>` + V[page]();
      bind();
    }
    let imp = null;
    function bind() {
      $("#endImp") && ($("#endImp").onclick = () => { log("impersonation.end", imp, "—"); imp = null; render(); toast("Impersonation ended"); });
      if (page === "orgs") {
        const rows = () => {
          const q = $("#q").value.toLowerCase(), fp = $("#fp").value, fs = $("#fs").value;
          $("#orgRows").innerHTML = orgs.filter(o => (!q || (o.name + o.slug + o.owner).toLowerCase().includes(q)) && (!fp || o.plan === fp) && (!fs || o.status === fs))
            .map(o => `<tr data-id="${o.id}"><td><b>${o.name}</b><br /><span class="dim mono">${o.slug}</span></td><td>${plans[o.plan].name}</td><td>${statusChip(o.status)}</td><td>${o.country}</td><td>${o.branches}</td><td>${o.stations}</td><td><span style="color:var(--ok)">${o.online}</span></td><td class="dim">${o.created.toDateString().slice(4)}</td></tr>`).join("") || `<tr><td colspan="8" class="dim" style="text-align:center;padding:30px">No organizations match.</td></tr>`;
          $("#orgRows").querySelectorAll("tr[data-id]").forEach(r => r.onclick = () => openOrg(r.dataset.id));
        };
        ["#q", "#fp", "#fs"].forEach(s => $(s).oninput = rows); rows();
        $("#newOrg").onclick = newOrg;
      }
      if (page === "billing") $("#billRows").querySelectorAll("tr").forEach(r => r.onclick = () => openOrg(r.dataset.id));
      if (page === "plans") document.querySelectorAll("[data-plan]").forEach(c => c.onchange = () => {
        const p = plans[c.dataset.plan]; c.checked ? p.f.add(c.dataset.f) : p.f.delete(c.dataset.f);
        log("plan.feature_toggle", `${p.name}: ${c.dataset.f} → ${c.checked ? "on" : "off"}`, "Plan catalog update");
        toast(`${p.name}: ${c.dataset.f} ${c.checked ? "enabled" : "disabled"} for ${orgs.filter(o => o.plan === c.dataset.plan).length} orgs`);
        render();
      });
      if (page === "releases") {
        document.querySelectorAll("[data-rel]").forEach(b => b.onclick = () => { const r = releases[b.dataset.rel]; r.pct = r.pct < 25 ? 25 : r.pct < 50 ? 50 : 100; if (r.pct === 100) r.ch = "stable"; log("release.rollout", `${r.c} ${r.v} → ${r.pct}%`, "Rollout healthy"); render(); toast(`${r.c} ${r.v} rolled out to ${r.pct}%`); });
        $("#newRel").onclick = () => modal(`<h3>Publish release</h3><div class="field">Component<select id="rc"><option>Windows Agent</option><option>Gaming Shell</option><option>KDS</option></select></div><div class="field">Version<input id="rv" value="2.5.0" /></div><div class="field">Initial rollout<select id="rp"><option value="5">5% (canary)</option><option value="25">25%</option><option value="100">100%</option></select></div>`, "Publish", () => { releases.unshift({ c: $("#rc").value, v: $("#rv").value, ch: $("#rp").value === "100" ? "stable" : "beta", pct: +$("#rp").value, d: "2026-09-26", notes: "Published from demo" }); log("release.publish", `${$("#rc").value} ${$("#rv").value}`, "New build"); render(); toast("Release published"); });
      }
    }

    function openOrg(id) {
      const o = orgs.find(x => x.id === id), p = plans[o.plan], en = enabled(o);
      const d = $("#drawer");
      d.innerHTML = `<button class="x" onclick="document.getElementById('drawer').classList.remove('open')">×</button>
        <h1 style="font-size:22px">${o.name}</h1><div class="dim mono">${o.slug} · ${o.id}</div>
        <div style="margin-top:10px">${statusChip(o.status)} <span class="chip p">${p.name}</span></div>
        <div class="dl"><div><small>Owner</small>${o.owner}</div><div><small>Country</small>${o.country}</div>
          <div><small>Branches</small>${o.branches} / ${p.b ?? "∞"}</div><div><small>Stations</small>${o.stations} / ${p.d ?? "∞"}</div>
          <div><small>Staff</small>${o.staff} / ${p.e ?? "∞"}</div><div><small>Stations online</small>${o.online}</div></div>
        <div class="acts">
          ${o.status === "SUSPENDED" ? `<button class="btn okb" id="act">Activate</button>` : `<button class="btn danger" id="sus">Suspend</button>`}
          <button class="btn" id="imp">Impersonate</button>
          <select class="btn" id="chPlan">${Object.keys(plans).map(k => `<option value="${k}" ${k === o.plan ? "selected" : ""}>Plan: ${plans[k].name}</option>`).join("")}</select>
        </div>
        <h3 style="font:600 15px var(--display);margin:20px 0 4px">Feature overrides</h3><div class="dim" style="font-size:12.5px">Toggling here overrides the ${p.name} plan default for this organization only.</div>
        <div class="flags" style="max-height:none">${FEATURES.map(([k, l]) => `<label class="flag"><span>${l} ${k in o.overrides ? '<span class="chip warn" style="font-size:10.5px;padding:0 6px">override</span>' : ""}</span><span class="sw"><input type="checkbox" data-of="${k}" ${en.has(k) ? "checked" : ""}/><span></span></span></label>`).join("")}</div>`;
      d.classList.add("open");
      const ask = (title, cb) => modal(`<h3>${title}</h3><p class="dim">Sensitive action — a reason is required and stored in the audit log.</p><div class="field">Reason<textarea id="reason" rows="3"></textarea></div>`, "Confirm", () => { const r = $("#reason").value.trim(); if (!r) { toast("A reason is required"); return false; } cb(r); });
      $("#sus") && ($("#sus").onclick = () => ask(`Suspend ${o.name}?`, (r) => { o.status = "SUSPENDED"; log("org.suspend", o.name, r); toast(`${o.name} suspended — staff and stations signed out`); render(); openOrg(id); }));
      $("#act") && ($("#act").onclick = () => ask(`Activate ${o.name}?`, (r) => { o.status = "ACTIVE"; log("org.activate", o.name, r); toast(`${o.name} activated`); render(); openOrg(id); }));
      $("#imp").onclick = () => ask(`Impersonate ${o.name}?`, (r) => { imp = o.name; log("impersonation.start", o.name, r); d.classList.remove("open"); render(); toast("Impersonation started (read-only, 30 min)"); });
      $("#chPlan").onchange = (e) => { const from = o.plan; o.plan = e.target.value; log("org.plan_change", `${o.name}: ${from} → ${o.plan}`, "Changed by platform admin"); toast(`${o.name} moved to ${plans[o.plan].name}`); render(); openOrg(id); };
      d.querySelectorAll("[data-of]").forEach(c => c.onchange = () => {
        const k = c.dataset.of; if (plans[o.plan].f.has(k) === c.checked) delete o.overrides[k]; else o.overrides[k] = c.checked;
        log("org.feature_override", `${o.name}: ${k} → ${c.checked ? "on" : "off"}`, "Per-org override"); toast(`${k} ${c.checked ? "enabled" : "disabled"} for ${o.name}`); openOrg(id);
      });
    }
    function newOrg() {
      modal(`<h3>New organization</h3><div class="field">Name<input id="nn" value="Arena Nova" /></div><div class="field">Owner email<input id="ne" value="owner@arenanova.test" /></div><div class="field">Country<select id="nc">${countries.map(c => `<option>${c}</option>`).join("")}</select></div><div class="field">Plan<select id="np">${Object.keys(plans).map(k => `<option value="${k}">${plans[k].name}</option>`).join("")}</select></div>`, "Create", () => {
        const n = $("#nn").value.trim() || "New org";
        orgs.unshift({ id: "org_" + (2000 + orgs.length), name: n, slug: n.toLowerCase().replace(/[^a-z]+/g, "-"), plan: $("#np").value, status: "TRIAL", country: $("#nc").value, branches: 1, stations: 0, online: 0, staff: 1, created: new Date(), overrides: {}, owner: $("#ne").value });
        log("org.create", n, "Onboarding"); render(); toast(`${n} created — invite sent to the owner`);
      });
    }
    function modal(html, okLabel, onOk) {
      $("#modalBody").innerHTML = html + `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn" id="mc">Cancel</button><button class="btn pri" id="mo">${okLabel}</button></div>`;
      $("#modal").classList.add("open");
      $("#mc").onclick = () => $("#modal").classList.remove("open");
      $("#mo").onclick = () => { if (onOk() !== false) $("#modal").classList.remove("open"); };
    }
    $("#modal").onclick = (e) => { if (e.target.id === "modal") $("#modal").classList.remove("open"); };
    render();
  </script>
</body>
</html>
